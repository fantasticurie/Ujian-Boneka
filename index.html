<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ujian Morfologi Boneka Aku - Sayangg</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-dark: #5d4037;
            --highlight-pink: #ff4d85;
            --highlight-blue: #4d94ff;
            --danger-red: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            /* Transisi Background Warna Warni: Pink -> Kuning -> Biru -> Ungu -> Hijau */
            background: linear-gradient(-45deg, #ffcce5, #ffffcc, #cce5ff, #e5ccff, #b8f2e6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Mencegah scrollbar bocor dari animasi background */
            position: relative;
            padding: 15px;
            color: var(--text-dark);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container Animasi Elemen Melayang */
        #bg-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        /* Animasi Elemen Melayang Diperbesar */
        .floating-element {
            position: absolute;
            opacity: 0;
            z-index: 0;
            user-select: none;
            bottom: -150px;
            animation: floatBackground linear infinite;
            filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.5));
        }

        @keyframes floatBackground {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(-120vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Bubble Card Dinamis & Responsif */
        #main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 550px;
            max-height: 90vh; /* Memastikan tidak jebol di HP */
            overflow-y: auto; /* Bisa discroll ke bawah jika konten panjang */
            overflow-x: hidden;
            text-align: center;
            border: 6px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 10;
            transition: background 0.8s ease, box-shadow 0.8s ease;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Scrollbar Aesthetic untuk Main Card */
        #main-card::-webkit-scrollbar { width: 8px; }
        #main-card::-webkit-scrollbar-track { background: transparent; }
        #main-card::-webkit-scrollbar-thumb { background: #ffb3c6; border-radius: 10px; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Animasi transisi soal */
        .fade-transition {
            animation: slideFade 0.5s ease forwards;
        }

        @keyframes slideFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Welcome Screen Koala Emoji */
        .emoji-header {
            font-size: 5rem; /* Lebih besar */
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));
            margin-bottom: 10px;
            display: inline-block;
            animation: bounce 2.5s infinite;
        }
        
        .sparkles {
            font-size: 2rem;
            position: absolute;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes pulse {
            from { transform: scale(0.8); opacity: 0.7; }
            to { transform: scale(1.2); opacity: 1; }
        }

        h1 { 
            color: var(--highlight-pink); 
            font-size: 2.2rem; 
            font-weight: 700; 
            margin-bottom: 15px; 
            text-shadow: 2px 2px 0px white;
            line-height: 1.2;
        }
        
        p { 
            line-height: 1.6; 
            font-weight: 500; 
            font-size: 1.15rem; 
            margin-bottom: 10px;
        }

        /* Highlight text styling */
        .hl-pink { color: var(--highlight-pink); font-weight: 700; }
        .hl-blue { color: var(--highlight-blue); font-weight: 700; }
        .hl-green { color: #0f9d58; font-weight: 700; }

        /* Timer UI */
        .timer-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
        }

        .timer-circle {
            width: 100%;
            height: 100%;
            background: #ff8eaa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            border: 5px solid white;
            box-shadow: 0 8px 20px rgba(255, 142, 170, 0.4);
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .timer-warning {
            animation: pulse-red 0.8s infinite !important;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); background-color: var(--danger-red); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
            50% { transform: scale(1.15); background-color: #d60000; box-shadow: 0 0 0 15px rgba(255, 77, 77, 0); }
            100% { transform: scale(1); background-color: var(--danger-red); box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        /* Opsi Jawaban (Button) */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }

        .btn-option {
            background: white;
            border: 4px solid #cce5ff;
            padding: 18px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            color: var(--text-dark);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 0 #cce5ff;
            text-align: center;
            line-height: 1.3;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-4px);
            background: #fffbe6;
            border-color: #ffd93d;
            box-shadow: 0 10px 0 #ffd93d;
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ffd93d;
        }

        .btn-option:disabled {
            cursor: not-allowed;
        }

        .correct { 
            background: #d1f2eb !important; 
            border-color: #1abc9c !important; 
            box-shadow: 0 6px 0 #16a085 !important; 
            color: #0b504c !important; 
            transform: scale(1.03);
            font-weight: 700;
            animation: popCorrect 0.4s ease;
            z-index: 2;
        }
        
        @keyframes popCorrect {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1.03); }
        }

        .wrong { 
            background: #ffe6e6 !important; 
            border-color: #ff6b6b !important; 
            box-shadow: 0 6px 0 #ee5253 !important; 
            color: #c0392b !important; 
            opacity: 0.7;
        }

        /* Tombol Aksi Bawah */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-primary, .btn-secondary {
            color: white;
            border: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            font-family: 'Fredoka', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #ff6b9d;
            box-shadow: 0 8px 0 #d45d7d;
        }

        .btn-primary:hover {
            background: #ff4d85;
            transform: translateY(-4px);
            box-shadow: 0 12px 0 #d45d7d;
        }

        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 0 #d45d7d; }

        .btn-secondary {
            background: #4d94ff;
            box-shadow: 0 8px 0 #2b6bd4;
        }

        .btn-secondary:hover {
            background: #3380ff;
            transform: translateY(-4px);
            box-shadow: 0 12px 0 #2b6bd4;
        }

        .btn-secondary:active { transform: translateY(4px); box-shadow: 0 2px 0 #2b6bd4; }

        /* Teks Pertanyaan */
        #question-text {
            color: var(--text-dark); 
            margin-bottom: 25px; 
            font-weight: 700; 
            font-size: 1.4rem;
            line-height: 1.4;
        }

        .q-counter {
            font-size: 1rem; 
            color: #ff8eaa; 
            display: block; 
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Rangkuman Jawaban */
        .summary-container {
            text-align: left;
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            border: 3px dashed #ff8eaa;
            display: none; 
            animation: slideFade 0.4s ease;
        }

        .summary-item {
            margin-bottom: 15px;
            border-bottom: 2px dotted #ffcce5;
            padding-bottom: 10px;
            font-size: 1.05rem;
        }
        .summary-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-q { font-weight: 600; color: var(--text-dark); margin-bottom: 5px; line-height: 1.4; }
        .summary-a { color: #1abc9c; font-weight: 700; background: #e8f8f5; padding: 5px 10px; border-radius: 8px; display: inline-block;}

        .hidden { display: none !important; }

        /* Responsive Fix untuk Mobile Kecil */
        @media (max-width: 480px) {
            #main-card {
                padding: 30px 20px;
                border-radius: 30px;
            }
            .emoji-header { font-size: 4.5rem; }
            h1 { font-size: 1.8rem; }
            #question-text { font-size: 1.25rem; }
            .btn-option { padding: 15px; font-size: 1rem; }
            .btn-primary, .btn-secondary { padding: 15px 20px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<!-- Latar Belakang Melayang Dinamis -->
<div id="bg-elements"></div>

<div id="main-card">
    <!-- WELCOME SCREEN -->
    <div id="welcome-screen">
        <div style="position: relative; display: inline-block;">
            <span class="sparkles" style="top: -10px; left: -20px;">✨</span>
            <div class="emoji-header">🧸💕</div>
            <span class="sparkles" style="bottom: 10px; right: -20px; animation-delay: 0.5s;">✨</span>
        </div>
        <h1>Halo Sayangg!</h1>
        <p>Selamat Datang Peserta Ujian Kesayangan:<br>
            <b style="font-size: 1.4rem;" class="hl-blue">Muhammad Fairuz Azri I.</b>
        </p>
        <p style="margin-top: 20px; font-size: 1.1rem; padding: 0 10px;">
            Siap untuk tes ingatan tentang <span class="hl-pink">Ntu</span>, <span class="hl-blue">Mpui</span>, dan kawan-kawan?<br>
            <span style="color: #ff4d85; font-weight: 700;">Jangan sampai salah ya! 🧸✨</span>
        </p>
        <div class="action-group">
            <button class="btn-primary" onclick="startQuiz()">Mulai Ujian! 🚀</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden">
        <div class="timer-container">
            <div id="timer" class="timer-circle">20</div>
        </div>
        <h2 id="question-text">Pertanyaan</h2>
        <div class="options-grid" id="options-container"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="hidden">
        <div class="emoji-header" id="result-emoji">🏆</div>
        <h1 id="result-title">Ujian Selesai! 🎉</h1>
        <p id="final-score" style="font-size: 3.5rem; font-weight: 800; color: #ff6b9d; text-shadow: 3px 3px 0px #ffe6ef; margin: 5px 0;"></p>
        
        <!-- Pesan Penutup Dinamis -->
        <p id="closing-msg" style="font-size: 1.2rem; font-weight: 600; line-height: 1.5; padding: 10px; margin-bottom: 10px;"></p>
        
        <!-- Rangkuman Jawaban -->
        <div id="summary" class="summary-container">
            <h3 style="margin-top: 0; color: #ff4d85; text-align: center; margin-bottom: 20px;">📖 Kunci Jawaban</h3>
        </div>
        
        <div class="action-group">
            <button class="btn-primary" onclick="location.reload()">Ulangi Ujian 🔄</button>
            <button class="btn-secondary" id="btn-toggle-summary" onclick="toggleSummary()">Lihat Kunci Jawaban 📖</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        { q: "Bagaimana saat <span class='hl-pink'>Ntu</span> menangis?", a: "Kedua tangannya menutup mata", options: ["Kedua tangannya menutup mata", "Menutup telinga", "Sembunyi di bantal", "Berteriak kencang"] },
        { q: "Bagaimana tekstur bulu <span class='hl-pink'>Ntu</span>?", a: "Tidak halus, tetapi tidak kasar juga", options: ["Sangat halus", "Tidak halus, tetapi tidak kasar juga", "Seperti handuk kasar", "Licin sekali"] },
        { q: "<span class='hl-pink'>Ntu</span> punya pita warna apa?", a: "Biru dan kuning", options: ["Merah dan hijau", "Pink dan putih", "Biru dan kuning", "Hitam dan ungu"] },
        { q: "Siapa nama boneka <span class='hl-pink'>rubah</span> kita?", a: "mpui", options: ["foxy", "mochi", "mpui", "lulu"] },
        { q: "Bagaimana tekstur bulu <span class='hl-blue'>Mpui</span>?", a: "Halus dan lembut", options: ["Kasar", "Tipis", "Agak lengket", "Halus dan lembut"] },
        { q: "Kalo <span class='hl-pink'>Ici</span> marah, namanya berubah jadi siapa?", a: "icung", options: ["icung", "ica", "ici-ici", "cungir"] },
        { q: "Siapa nama boneka <span class='hl-green'>capibara</span> kita?", a: "heli", options: ["capy", "bara", "gembul", "heli"] },
        { q: "<span class='hl-blue'>Mpui</span> diberi nama pada tahun berapa?", a: "2024", options: ["2022", "2023", "2024", "2025"] },
        { q: "<span class='hl-blue'>Mpui</span> pertama kali diberi nama dimana?", a: "di lampu merah", options: ["di taman", "di mall", "di lampu merah", "di toko buku"] },
        { q: "Tahun berapa <span class='hl-green'>Heli</span> ditemukan?", a: "2026", options: ["2023", "2024", "2025", "2026"] },
        { q: "Sebenarnya, hewan apakah <span class='hl-pink'>Ntu</span> itu?", a: "Koala", options: ["Panda", "Koala", "Beruang", "Kelinci"] },
        
        // --- 5 PERTANYAAN BARU ---
        { q: "Apa nama boneka yang berbentuk <span class='hl-green'>ulat</span>?", a: "mbui", options: ["momo", "mbui", "ulil", "cater"] },
        { q: "<span class='hl-blue'>Mbui</span> memiliki berapa bagian kepala?", a: "3", options: ["1", "2", "3", "4"] },
        { q: "<span class='hl-blue'>Mbui</span> memiliki berapa mata?", a: "6", options: ["2", "4", "6", "8"] },
        { q: "<span class='hl-blue'>Mbui</span> berwarna apa?", a: "cream", options: ["hijau", "putih", "kuning", "cream"] },
        { q: "Ciri-ciri kuping <span class='hl-pink'>Nja</span>?", a: "kedua kupingnya di belakang kepala", options: ["menghadap ke depan", "kedua kupingnya di belakang kepala", "satu di atas satu di bawah", "panjang dan menjuntai"] }
    ];

    // Array warna pastel untuk mengubah mood background card tiap soal
    const bubbleColors = [
        "rgba(255, 235, 245, 0.95)", // Soft Pink
        "rgba(255, 250, 230, 0.95)", // Soft Yellow
        "rgba(235, 245, 255, 0.95)", // Soft Blue
        "rgba(240, 255, 245, 0.95)", // Soft Green
        "rgba(250, 240, 255, 0.95)"  // Soft Purple
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    const TOTAL_TIME = 20;
    let timeLeft = TOTAL_TIME;
    let timerInterval;
    let canAnswer = true;

    // --- SETUP ANIMASI BACKGROUND ---
    function setupBackground() {
        // Memperbanyak Koala (🐨) agar lebih sering muncul
        const emojis = ['🐨', '🐨', '🦊', '🐹', '🌈', '💖', '✨', '☁️', '🎀', '🌸', '🧸', '🐨'];
        const bgContainer = document.getElementById('bg-elements');
        const totalElements = 18; // Jumlah elemen ditingkatkan

        for (let i = 0; i < totalElements; i++) {
            let el = document.createElement('div');
            el.className = 'floating-element';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Posisi X diatur secara merata dengan sedikit random offset
            let randomX = Math.random() * 100;
            el.style.left = `${randomX}vw`;
            
            // Delay, Durasi, dan Ukuran (DIPERBESAR)
            el.style.animationDelay = (Math.random() * 8) + 's';
            el.style.animationDuration = (10 + Math.random() * 10) + 's'; 
            el.style.fontSize = (Math.random() * 40 + 40) + 'px'; // Ukuran random antara 40px - 80px
            bgContainer.appendChild(el);
        }
    }
    setupBackground();

    // --- LOGIKA KUIS ---
    function startQuiz() {
        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        clearInterval(timerInterval);
        timeLeft = TOTAL_TIME;
        
        // Ganti warna card secara dinamis
        const card = document.getElementById('main-card');
        const currentColor = bubbleColors[currentQuestionIndex % bubbleColors.length];
        card.style.background = currentColor;
        
        // Memaksa animasi restart
        const quizScreen = document.getElementById('quiz-screen');
        quizScreen.classList.remove('fade-transition');
        void quizScreen.offsetWidth; 
        quizScreen.classList.add('fade-transition');

        const timerEl = document.getElementById('timer');
        timerEl.innerText = timeLeft;
        timerEl.classList.remove('timer-warning');
        
        const q = questions[currentQuestionIndex];
        document.getElementById('question-text').innerHTML = `
            <span class="q-counter">Soal ${currentQuestionIndex + 1} / ${questions.length}</span>
            ${q.q}
        `;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt) => {
            const button = document.createElement('button');
            button.innerText = opt;
            button.classList.add('btn-option');
            button.onclick = () => checkAnswer(opt, button);
            optionsContainer.appendChild(button);
        });

        // Jalankan Timer
        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            
            if(timeLeft <= 5 && timeLeft > 0) {
                timerEl.classList.add('timer-warning');
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkAnswer("", null); // Waktu habis dianggap salah
            }
        }, 1000);
    }

    function checkAnswer(selected, button) {
        if(!canAnswer) return;
        canAnswer = false;
        clearInterval(timerInterval);
        document.getElementById('timer').classList.remove('timer-warning');

        const correctAns = questions[currentQuestionIndex].a;
        const buttons = document.querySelectorAll('.btn-option');

        // Kunci semua tombol
        buttons.forEach(btn => btn.disabled = true);

        if (selected === correctAns) {
            button.classList.add('correct');
            score++;
        } else {
            if(button) button.classList.add('wrong');
            // Tunjukkan yang benar
            buttons.forEach(btn => {
                if(btn.innerText === correctAns) btn.classList.add('correct');
            });
        }

        // Lanjut soal setelah 1.5 detik
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }, 1500);
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        
        // Kembalikan warna putih agar teks terbaca jelas
        document.getElementById('main-card').style.background = "rgba(255, 255, 255, 0.95)";
        
        const emojiEl = document.getElementById('result-emoji');
        const titleEl = document.getElementById('result-title');
        const msgEl = document.getElementById('closing-msg');
        
        if (score === questions.length) {
            emojiEl.innerText = "🏆💖";
            titleEl.innerText = "WOAAAH SEMPURNA! 🌟";
            msgEl.innerHTML = "Yeayyy! 100%! 🥰<br><span style='color: var(--highlight-pink); font-weight: 700;'>wahh, kamu terbukti sayang sama aku!!!</span> Ntu, Mpui, dan Heli bangga banget!! Makin sayanggg! 💕✨";
            msgEl.style.color = "#d45d7d";
        } else if (score > 9) { // Disesuaikan dengan total pertanyaan baru (16 soal)
            emojiEl.innerText = "🥰🧸";
            titleEl.innerText = "Hebat Sayangg! 🎉";
            msgEl.innerHTML = "Yeyyy nilainya bagus! 🥰<br>Seneng banget rasanya kamuu merhatiin dan inget mereka. Makasih ya kamuu udah sayang sama Ntu, Mpui dkk! Luv youuu! 💖✨";
            msgEl.style.color = "#2d6a4f";
        } else {
            emojiEl.innerText = "🥺💔";
            titleEl.innerText = "Yahhh... Lupa ya?";
            msgEl.innerHTML = "Sayangg banyak lupanya ya? 🥺💔<br><span style='color: var(--danger-red);'>Sedih deh Ntu sama Mpui...</span> Tapi gak apa-apa, habis ini dibaca kuncinya dan dihafalin lagi ya? Janji yaa? 🧸💕";
            msgEl.style.color = "#c0392b";
        }

        // Isi kontainer Rangkuman
        const summaryCont = document.getElementById('summary');
        // Kosongkan isi summary sebelumnya jika di-refresh
        summaryCont.innerHTML = '<h3 style="margin-top: 0; color: #ff4d85; text-align: center; margin-bottom: 20px;">📖 Kunci Jawaban</h3>';
        
        questions.forEach((item, index) => {
            summaryCont.innerHTML += `
                <div class="summary-item">
                    <div class="summary-q">${index + 1}. ${item.q}</div>
                    <div class="summary-a">✅ ${item.a}</div>
                </div>
            `;
        });
    }

    function toggleSummary() {
        const summaryCont = document.getElementById('summary');
        const btnToggle = document.getElementById('btn-toggle-summary');
        
        if (summaryCont.style.display === "none" || summaryCont.style.display === "") {
            summaryCont.style.display = "block";
            btnToggle.innerText = "Sembunyikan Kunci 🙈";
            // Scroll sedikit ke bawah agar rangkuman terlihat
            setTimeout(() => {
                document.getElementById('main-card').scrollBy({ top: 300, behavior: 'smooth' });
            }, 100);
        } else {
            summaryCont.style.display = "none";
            btnToggle.innerText = "Lihat Kunci Jawaban 📖";
        }
    }
</script>

</body>
</html>
