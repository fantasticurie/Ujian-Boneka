<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Morfologi Boneka Aku - Kak Azri</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ffcce5;
            --blue: #cce5ff;
            --yellow: #ffffcc;
            --green: #b8f2e6;
            --purple: #e5ccff;
            --text: #5d4037;
            --highlight-pink: #ff4d85;
            --highlight-blue: #4d94ff;
            --danger-red: #ff3333;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(-45deg, #ffcce5, #cce5ff, #ffffcc, #e5ccff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animasi Elemen Melayang di Background */
        .floating-element {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
            z-index: -1;
            user-select: none;
            animation: floatBackground 12s linear infinite;
        }

        @keyframes floatBackground {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        #main-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 550px;
            text-align: center;
            border: 8px solid white;
            position: relative;
            z-index: 10;
            margin: 20px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .koala-main {
            font-size: 90px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
            margin-bottom: 5px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 { 
            color: var(--highlight-pink); 
            font-size: 2.2rem; 
            font-weight: 700; 
            margin-bottom: 15px; 
            text-shadow: 2px 2px 0px white;
        }
        
        p { 
            color: var(--text); 
            line-height: 1.6; 
            font-weight: 500; 
            font-size: 1.15rem; 
        }

        /* Teks Highlight */
        .hl-pink { color: var(--highlight-pink); font-weight: 700; }
        .hl-blue { color: var(--highlight-blue); font-weight: 700; }
        .hl-green { color: #20b2aa; font-weight: 700; }

        .timer-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #ff85a2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
            transition: all 0.3s ease;
        }

        /* Animasi saat waktu mau habis (merah & berdetak) */
        .timer-warning {
            animation: pulse-red 0.8s infinite !important;
            color: white !important;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); background-color: var(--danger-red); border-color: #ffb3b3; box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            50% { transform: scale(1.15); background-color: #d60000; border-color: #ffcccc; box-shadow: 0 0 0 15px rgba(255, 51, 51, 0); }
            100% { transform: scale(1); background-color: var(--danger-red); border-color: #ffb3b3; box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        .btn-option {
            background: white;
            border: 4px solid var(--blue);
            padding: 16px;
            margin: 10px 0;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-size: 1.15rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: var(--text);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 0 var(--blue);
            position: relative;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-4px);
            background: var(--yellow);
            border-color: #ffd93d;
            box-shadow: 0 9px 0 #ffd93d;
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ffd93d;
        }

        .correct { 
            background: #b8f2e6 !important; 
            border-color: #20b2aa !important; 
            box-shadow: 0 5px 0 #20b2aa !important; 
            color: #0b504c !important; 
            transform: scale(1.02);
            animation: popIn 0.3s ease;
        }
        
        .wrong { 
            background: #ffdada !important; 
            border-color: #ff4d4d !important; 
            box-shadow: 0 5px 0 #ff4d4d !important; 
            color: #a30000 !important; 
            opacity: 0.8;
        }

        .btn-start {
            background: #ff6b9d;
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 0 #d45d7d;
            transition: 0.2s;
            margin-top: 20px;
            width: 100%;
        }

        .btn-start:hover {
            background: #ff4d85;
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #d45d7d;
        }

        .btn-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #d45d7d; }

        /* Rangkuman Section */
        .summary-container {
            text-align: left;
            margin-top: 25px;
            max-height: 250px;
            overflow-y: auto;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            border: 3px dashed var(--pink);
        }

        .summary-item {
            margin-bottom: 12px;
            border-bottom: 2px dotted var(--pink);
            padding-bottom: 8px;
            font-size: 1rem;
        }

        .summary-q { font-weight: 700; color: var(--highlight-blue); margin-bottom: 4px; }
        .summary-a { color: #2d6a4f; font-weight: 700; }

        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #ff85a2; border-radius: 10px; }
        
        #question-text {
            color: var(--text); 
            margin-bottom: 25px; 
            font-weight: 700; 
            font-size: 1.3rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="bg-elements"></div>

<div id="main-card">
    <!-- WELCOME SCREEN -->
    <div id="welcome-screen">
        <div class="koala-main">🐨</div>
        <h1>Halo Kak Azri! 💖</h1>
        <p>Selamat Datang Peserta Ujian Kesayangan:<br>
            <b style="font-size: 1.4rem;" class="hl-blue">Muhammad Fairuz Azri Irwanto</b>
        </p>
        <p style="margin-top: 15px; font-size: 1.1rem;">
            Siap untuk tes ingatan tentang <span class="hl-pink">Ntu</span>, <span class="hl-blue">Mpui</span>, dan kawan-kawan?<br>
            <span style="color: #ff4d85; font-weight: 700;">Jangan sampai salah ya! 🧸✨</span>
        </p>
        <button class="btn-start" onclick="startQuiz()">Mulai Ujian! 🚀</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="hidden">
        <div id="timer" class="timer-circle">20</div>
        <h2 id="question-text">Pertanyaan</h2>
        <div id="options-container"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="hidden">
        <div class="koala-main" id="result-emoji">🏆</div>
        <h1 id="result-title">Ujian Selesai! 🎉</h1>
        <p id="final-score" style="font-size: 2.5rem; font-weight: 700; color: #ff85a2; text-shadow: 2px 2px 0px #ffe6ef; margin: 10px 0;"></p>
        
        <!-- Pesan emosional -->
        <p id="closing-msg" style="font-size: 1.2rem; font-weight: 700; line-height: 1.5; padding: 0 10px;"></p>
        
        <h3 style="margin-top: 25px; color: #7a5c5c; text-align: left; padding-left: 5px;">📖 Rangkuman Jawaban Benar:</h3>
        <div id="summary" class="summary-container"></div>
        
        <button class="btn-start" onclick="location.reload()">Ulangi Ujian 🔄</button>
    </div>
</div>

<script>
    // Memasukkan span class warna di dalam pertanyaan agar lebih WOW
    const questions = [
        { q: "Bagaimana saat <span class='hl-pink'>Ntu</span> menangis?", a: "Kedua tangannya menutup mata", options: ["Kedua tangannya menutup mata", "Menutup telinga", "Sembunyi di bantal", "Berteriak kencang"] },
        { q: "Bagaimana tekstur bulu <span class='hl-pink'>Ntu</span>?", a: "Tidak halus, tetapi tidak kasar juga", options: ["Sangat halus", "Tidak halus, tetapi tidak kasar juga", "Seperti handuk kasar", "Licin sekali"] },
        { q: "<span class='hl-pink'>Ntu</span> punya pita warna apa?", a: "Biru dan kuning", options: ["Merah dan hijau", "Pink dan putih", "Biru dan kuning", "Hitam dan ungu"] },
        { q: "Siapa nama boneka <span class='hl-pink'>rubah</span> kita?", a: "mpui", options: ["foxy", "mochi", "mpui", "lulu"] },
        { q: "Bagaimana tekstur bulu <span class='hl-blue'>Mpui</span>?", a: "Halus dan lembut", options: ["Kasar", "Tipis", "Agak lengket", "Halus dan lembut"] },
        { q: "Kalo <span class='hl-pink'>Ici</span> marah, namanya berubah jadi siapa?", a: "icung", options: ["icung", "ica", "ici-ici", "cungir"] },
        { q: "Siapa nama boneka <span class='hl-green'>capibara</span> kita?", a: "heli", options: ["capy", "bara", "gembul", "heli"] },
        { q: "<span class='hl-blue'>Mpui</span> diberi nama pada tahun berapa?", a: "2024", options: ["2022", "2023", "2024", "2025"] },
        { q: "<span class='hl-blue'>Mpui</span> pertama kali diberi nama dimana?", a: "di lampu merah", options: ["di taman", "di mall", "di lampu merah", "di toko buku"] },
        { q: "Tahun berapa <span class='hl-green'>Heli</span> ditemukan?", a: "2026", options: ["2023", "2024", "2025", "2026"] },
        { q: "Sebenarnya, hewan apakah <span class='hl-pink'>Ntu</span> itu?", a: "Koala", options: ["Panda", "Koala", "Beruang", "Kelinci"] }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    const TOTAL_TIME = 20;
    let timeLeft = TOTAL_TIME;
    let timerInterval;
    let canAnswer = true;

    // Tambah elemen background melayang secara random
    const emojis = ['🐨', '🦊', '🐹', '🌈', '💖', '✨', '☁️', '🎀'];
    const bgContainer = document.getElementById('bg-elements');
    for (let i = 0; i < 20; i++) {
        let el = document.createElement('div');
        el.className = 'floating-element';
        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDelay = Math.random() * 10 + 's';
        el.style.fontSize = (Math.random() * 30 + 20) + 'px';
        bgContainer.appendChild(el);
    }

    function startQuiz() {
        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        clearInterval(timerInterval);
        timeLeft = TOTAL_TIME;
        
        const timerEl = document.getElementById('timer');
        timerEl.innerText = timeLeft;
        timerEl.classList.remove('timer-warning'); // Hapus efek panik
        
        const q = questions[currentQuestionIndex];
        document.getElementById('question-text').innerHTML = `Soal ${currentQuestionIndex + 1}:<br>${q.q}`;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.options.forEach((opt) => {
            const button = document.createElement('button');
            button.innerText = opt;
            button.classList.add('btn-option');
            button.onclick = () => checkAnswer(opt, button);
            optionsContainer.appendChild(button);
        });

        timerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            
            // Efek WOW: Waktu mau habis (5 detik)
            if(timeLeft <= 5 && timeLeft > 0) {
                timerEl.classList.add('timer-warning');
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                checkAnswer("", null); // Timeout
            }
        }, 1000);
    }

    function checkAnswer(selected, button) {
        if(!canAnswer) return;
        canAnswer = false;
        clearInterval(timerInterval);
        document.getElementById('timer').classList.remove('timer-warning');

        const correctAns = questions[currentQuestionIndex].a;
        const buttons = document.querySelectorAll('.btn-option');

        // Disable semua tombol biar ga bisa diklik double
        buttons.forEach(btn => btn.disabled = true);

        if (selected === correctAns) {
            button.classList.add('correct');
            score++;
        } else {
            if(button) button.classList.add('wrong');
            // Kasih tau mana jawaban yang bener
            buttons.forEach(btn => {
                if(btn.innerText === correctAns) btn.classList.add('correct');
            });
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) showQuestion();
            else showResult();
        }, 1800);
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
        
        const emojiEl = document.getElementById('result-emoji');
        const titleEl = document.getElementById('result-title');
        const msgEl = document.getElementById('closing-msg');
        
        // LOGIKA PERASAAN (Berdasarkan skor)
        if (score === questions.length) {
            emojiEl.innerText = "🏆💖";
            titleEl.innerText = "WOAAAH SEMPURNA! 🌟";
            msgEl.innerHTML = "Yeayyy! 100%! 🥰<br><span style='color: var(--highlight-pink);'>Kak Azri emang Papa Boneka paling peka sedunia!</span> Ntu, Mpui, dan Heli bangga banget!! Seneng banget rasanya Kakak merhatiin detail anak-anak kita. Aku makin sayanggg! 💕✨";
            msgEl.style.color = "#d45d7d";
        } else if (score > 5) {
            emojiEl.innerText = "🥰🧸";
            titleEl.innerText = "Hebat Sayang! 🎉";
            msgEl.innerHTML = "Yeyyy nilainya bagus! 🥰<br>Seneng banget rasanya Kak Azri merhatiin dan inget kita. Makasih ya sayang udah sayang sama Ntu, Mpui dkk! Luv youuu! 💖✨";
            msgEl.style.color = "#2d6a4f";
        } else {
            emojiEl.innerText = "🥺💔";
            titleEl.innerText = "Yahhh... Sedih...";
            msgEl.innerHTML = "Kak Azri banyak lupanya ya? 🥺💔<br><span style='color: var(--danger-red);'>Sedih deh Ntu sama Mpui...</span> Tapi gak apa-apa, habis ini dibaca rangkumannya dan dihafalin lagi ya sayang? Janji yaa? 🧸💕";
            msgEl.style.color = "#a30000";
        }

        // Tampilkan Rangkuman
        const summaryCont = document.getElementById('summary');
        questions.forEach((item, index) => {
            summaryCont.innerHTML += `
                <div class="summary-item">
                    <div class="summary-q">${index + 1}. ${item.q}</div>
                    <div class="summary-a">✅ Jawaban: ${item.a}</div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
