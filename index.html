<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Planner 2026 | Future Engineer</title>
    
    <meta name="theme-color" content="#ffd1dc">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --pastel-yellow: #fff9d2;
            --soft-pink: #ffd1dc;
            --rose-gold: #f4aeb8;
            --white-glass: rgba(255, 255, 255, 0.75);
            --text-dark: #4a4a4a;
            --warning-red: #ff7675;
            --warning-bg: #ffeaa7;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--pastel-yellow) 0%, #ffffff 50%, var(--soft-pink) 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        h1, h2, h3, .calendar-header {
            font-family: 'Nunito', sans-serif;
        }

        /* --- SPLASH SCREEN INTRO (ADDED FEATURE) --- */
        #intro-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #2d3436 0%, #e84393 100%);
            z-index: 99999; /* Pastikan selalu paling atas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
        }
        
        .intro-icon {
            font-size: 5rem;
            color: #fff9d2; /* Pastel yellow */
            margin-bottom: 20px;
            animation: pulse-glow 1.5s infinite;
        }

        .intro-title {
            font-family: 'Nunito', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 1px;
            padding: 0 20px;
        }

        .intro-subtitle {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            text-align: center;
            color: #ffd1dc; /* Soft pink */
            max-width: 80%;
            line-height: 1.5;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 249, 210, 0.5); }
            50% { transform: scale(1.15); text-shadow: 0 0 30px rgba(255, 249, 210, 1); }
            100% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 249, 210, 0.5); }
        }
        /* --- END OF SPLASH SCREEN INTRO --- */

        /* --- Header Glowing --- */
        .header-glow {
            background: linear-gradient(to right, #e84393, #fd79a8, #ff9ff3);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0px 4px 15px rgba(253, 121, 168, 0.4);
            letter-spacing: 1px;
        }

        /* --- Glassmorphism Cards (3D Effect) --- */
        .glass-card {
            background: var(--white-glass);
            border-radius: 20px;
            box-shadow: 0 10px 30px 0 rgba(253, 121, 168, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px 0 rgba(253, 121, 168, 0.25);
        }

        /* --- Form Elements --- */
        input[type="text"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(253, 121, 168, 0.4);
            border-radius: 10px;
            padding: 10px 15px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            background: #ffffff;
            border-color: #fd79a8;
            box-shadow: 0 0 10px rgba(253, 121, 168, 0.3);
        }

        button.btn-cute {
            background: linear-gradient(135deg, #ffeaa7 0%, #fd79a8 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(253, 121, 168, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        button.btn-cute:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(253, 121, 168, 0.5);
        }

        /* --- Checkbox --- */
        .custom-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #fd79a8;
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            background: white;
            transition: all 0.2s ease;
        }
        
        .custom-checkbox:checked {
            background: #fd79a8;
            border-color: #fd79a8;
        }
        
        .custom-checkbox:checked::after {
            content: '\f00c';
            font-family: 'FontAwesome';
            color: white;
            font-size: 12px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* --- List Items --- */
        .list-item {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #fd79a8;
            transition: all 0.3s ease;
        }
        
        .list-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
            border-left-color: #dfe6e9;
        }

        /* --- Panic Warning System --- */
        .panic-warning {
            background: #fff0f0 !important;
            border-left: 5px solid var(--warning-red) !important;
            animation: pulse-panic 2s infinite;
        }
        .panic-text {
            color: var(--warning-red);
            font-weight: 700;
        }

        @keyframes pulse-panic {
            0% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 118, 117, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 118, 117, 0); }
        }

        /* --- Calendar UI --- */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .calendar-day {
            padding: 8px 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .calendar-day:hover {
            background: #ffeaa7;
            transform: scale(1.05);
        }
        .calendar-day.today {
            background: #fd79a8 !important;
            color: white !important;
            font-weight: bold;
            box-shadow: 0 2px 10px rgba(253, 121, 168, 0.4);
        }
        
        /* GAYA KHUSUS HARI LIBUR & MINGGU */
        .calendar-day.holiday {
            color: #e74c3c !important; 
            font-weight: 800;
            background-color: rgba(253, 164, 175, 0.3); 
        }

        .calendar-day.has-event::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: #e84393;
            border-radius: 50%;
        }
        .calendar-day.selected {
            border: 2px solid #e84393;
            transform: scale(1.05);
            background: #ffeaa7 !important;
            color: #4a4a4a !important;
        }

        /* --- Polaroid & Pinned Image --- */
        .polaroid-frame {
            background: #fff;
            padding: 10px 10px 30px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 4px;
            position: relative;
            transition: transform 0.3s ease;
            width: 100%;
        }
        .polaroid-frame:hover { z-index: 10; }
        
        .pin-icon {
            position: absolute;
            top: -12px; left: 50%; transform: translateX(-50%);
            font-size: 1.8rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 5;
        }
        .polaroid-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 2px;
            background-color: #f8f9fa;
        }

        .tilt-left { transform: rotate(-3deg); }
        .tilt-left:hover { transform: rotate(0deg) scale(1.05); }
        .tilt-right { transform: rotate(3deg); }
        .tilt-right:hover { transform: rotate(0deg) scale(1.05); }
        .tilt-straight { transform: rotate(1deg); }
        .tilt-straight:hover { transform: rotate(0deg) scale(1.05); }

        /* --- Animations --- */
        .bg-animation-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden;
        }
        .anim-element {
            position: absolute;
            color: rgba(253, 121, 168, 0.15);
        }
        .float-star { animation: float-up 15s infinite linear; }
        .spin-gear { animation: spin-slow 20s infinite linear; }

        @keyframes float-up {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .anim-1 { left: 10%; font-size: 2rem; animation-duration: 18s; }
        .anim-2 { left: 30%; font-size: 4rem; top: 20%; color: rgba(255, 234, 167, 0.2); }
        .anim-3 { left: 60%; font-size: 1.5rem; animation-duration: 12s; animation-delay: 2s; }
        .anim-4 { left: 85%; font-size: 5rem; top: 60%; }
        .anim-5 { left: 45%; font-size: 3rem; animation-duration: 25s; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fd79a8; border-radius: 10px; }
        
        /* Nav & Notif Status */
        #notif-status {
            cursor: pointer;
            transition: all 0.3s;
        }
        #notif-status:hover { transform: scale(1.1); }
        
        .menu-btn-giant {
            width: 100%;
            max-width: 300px;
            height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            gap: 15px;
            border-radius: 25px;
            cursor: pointer;
        }
        .menu-btn-giant i { font-size: 3rem; }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <div id="intro-splash">
        <i class="fas fa-crown intro-icon"></i>
        <h1 class="intro-title">Welcome, Future Master of Engineering.</h1>
        <p class="intro-subtitle">Write your own story.<br>Make your dreams happen today, Tasya. ✨</p>
    </div>

    <div class="bg-animation-container">
        <i class="fas fa-star anim-element float-star anim-1"></i>
        <i class="fas fa-cog anim-element spin-gear anim-2"></i>
        <i class="fas fa-hard-hat anim-element float-star anim-3"></i>
        <i class="fas fa-cogs anim-element spin-gear anim-4"></i>
        <i class="fas fa-star anim-element float-star anim-5"></i>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-7xl flex-grow">
        
        <header class="text-center mb-10 relative">
            <button id="btn-back-home" class="absolute left-0 top-0 text-sm font-bold text-pink-600 bg-pink-100 px-3 py-1.5 rounded-lg shadow-sm hidden transition-transform hover:scale-105" onclick="showSection('home-section')">
                <i class="fas fa-arrow-left mr-1"></i> Menu
            </button>

            <div class="absolute right-0 top-0 text-xl" id="notif-status" onclick="requestNotificationPermission()" title="Aktifkan Notifikasi">
                <i class="fas fa-bell text-gray-400" id="notif-icon"></i>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-extrabold header-glow mb-3" id="main-title">
                be the kind author of your own story
            </h1>
            <p class="text-gray-600 font-medium text-lg" id="main-subtitle">
                <i class="fas fa-graduation-cap text-yellow-500 mr-2"></i> 2026 Future Engineer Dashboard
            </p>
        </header>

        <section id="home-section" class="flex flex-col md:flex-row items-center justify-center gap-8 mt-10">
            <div class="glass-card menu-btn-giant bg-white bg-opacity-80 border-4 border-pink-200 hover:border-pink-400 text-pink-600" onclick="showSection('planner-section')">
                <i class="far fa-calendar-alt text-pink-500"></i>
                <span class="font-extrabold font-nunito">My Planner</span>
            </div>
            
            <div class="glass-card menu-btn-giant bg-white bg-opacity-80 border-4 border-yellow-200 hover:border-yellow-400 text-yellow-700" onclick="showSection('finance-section')">
                <i class="fas fa-wallet text-yellow-500"></i>
                <span class="font-extrabold font-nunito">Keuangan Kos</span>
            </div>
        </section>

        <main id="finance-section" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
            
            <section class="glass-card p-6 flex flex-col relative overflow-hidden">
                <div class="absolute -right-10 -top-10 opacity-10 text-9xl text-yellow-500"><i class="fas fa-coins"></i></div>
                <h2 class="text-2xl font-bold mb-4 text-yellow-600 flex items-center">
                    <i class="fas fa-piggy-bank mr-3"></i> Dompet Tasya
                </h2>
                
                <div class="bg-white bg-opacity-60 rounded-xl p-4 mb-4 border border-yellow-200">
                    <p class="text-sm text-gray-500 font-medium mb-1">Sisa Saldo Saat Ini</p>
                    <h3 class="text-3xl font-extrabold text-gray-800" id="display-sisa-saldo">Rp 0</h3>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
