<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Morfologi Boneka - Muhammad Fairuz Azri Irwanto</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-pink: #ffdae9;
            --soft-blue: #d4f1f9;
            --soft-yellow: #fcf4dd;
            --soft-green: #e1f8dc;
            --soft-purple: #ede7f6;
            --text-color: #5d5d5d;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(45deg, var(--soft-pink), var(--soft-blue), var(--soft-yellow), var(--soft-green));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 500px;
            text-align: center;
            border: 5px solid white;
        }

        h1 { color: #ff85a1; font-weight: 700; }
        p { font-weight: 600; }

        .btn {
            background-color: white;
            border: 2px solid #ffdae9;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            transition: all 0.3s;
            color: #5d5d5d;
        }

        .btn:hover { background-color: var(--soft-blue); transform: scale(1.02); }
        
        .correct { background-color: #a8e6cf !important; border-color: #81c784 !important; }
        .wrong { background-color: #ff8b94 !important; border-color: #e57373 !important; }

        #timer-container {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff85a1;
            margin-bottom: 10px;
        }

        .koala-icon { font-size: 80px; margin-bottom: 10px; }
        .hidden { display: none; }
        
        .progress-bar {
            height: 12px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress { height: 100%; width: 0%; background: #ff85a1; transition: 0.5s; }

        #feedback { font-weight: bold; margin-top: 10px; min-height: 24px; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <div id="welcome-screen">
        <div class="koala-icon">🐨</div>
        <h1>Halo, Kak Azri! 💖</h1>
        <p>Selamat Datang Peserta Ujian: <br><strong>Muhammad Fairuz Azri Irwanto</strong></p>
        <p>Siap untuk tes kasih sayang dan ingatan tentang <b>boneka aku</b>?</p>
        <button class="btn" onclick="startQuiz()">Mulai Ujian ✨</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="timer-container">Sisa Waktu: <span id="time-left">20</span>s</div>
        <div class="progress-bar"><div id="progress"></div></div>
        <h3 id="question-text">Memuat pertanyaan...</h3>
        <div id="options-container"></div>
        <div id="feedback"></div>
    </div>

    <div id="result-screen" class="hidden">
        <div class="koala-icon">🎉</div>
        <h1>Ujian Selesai!</h1>
        <p id="final-score"></p>
        <p id="final-msg">Makasih sudah sayang sama Ntu, Mpui, dkk! 🎀</p>
        <button class="btn" onclick="location.reload()">Ulangi Ujian</button>
    </div>
</div>

<script>
    const questions = [
        { q: "Bagaimana saat Ntu menangis?", a: ["kedua tangannya menutup mata", "Menutup telinga", "Sembunyi di bantal", "Berteriak kencang"], correct: 0 },
        { q: "Bagaimana tekstur bulu Ntu?", a: ["Sangat halus", "tidak halus, tetapi tidak kasar juga", "Seperti handuk kasar", "Licin sekali"], correct: 1 },
        { q: "Ntu punya pita warna apa?", a: ["Merah dan hijau", "Pink dan putih", "biru dan kuning", "Hitam dan ungu"], correct: 2 },
        { q: "Nama boneka rubah?", a: ["foxy", "mochi", "mpui", "lulu"], correct: 2 },
        { q: "Bagaimana tekstur bulu Mpui?", a: ["Halus dan lembut", "Kasar", "Tipis", "Agak lengket"], correct: 0 },
        { q: "Ici kalo marah namanya jadi siapa?", a: ["ica", "ici-ici", "cungir", "icung"], correct: 3 },
        { q: "Boneka capibara namanya siapa?", a: ["capy", "bara", "heli", "gembul"], correct: 2 },
        { q: "Mpui diberi nama pada tahun berapa?", a: ["2022", "2023", "2024", "2025"], correct: 2 },
        { q: "Mpui diberi nama dimana?", a: ["di taman", "di lampu merah", "di mall", "di toko buku"], correct: 1 },
        { q: "Tahun berapa Heli ditemukan?", a: ["2023", "2024", "2025", "2026"], correct: 3 }
    ];

    let currentIdx = 0;
    let score = 0;
    let timer;
    let timeLeft = 20;

    function startQuiz() {
        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        if (currentIdx >= questions.length) {
            return showResult();
        }

        clearInterval(timer);
        timeLeft = 20;
        updateTimerDisplay();
        document.getElementById('feedback').innerText = "";

        const qData = questions[currentIdx];
        document.getElementById('question-text').innerText = qData.q;
        document.getElementById('progress').style.width = ((currentIdx / questions.length) * 100) + "%";

        const container = document.getElementById('options-container');
        container.innerHTML = "";

        qData.a.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx, btn);
            container.appendChild(btn);
        });

        timer = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timer);
                selectAnswer(-1, null); // Time out
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        document.getElementById('time-left').innerText = timeLeft;
    }

    function selectAnswer(idx, btn) {
        clearInterval(timer);
        const qData = questions[currentIdx];
        const correctIdx = qData.correct;
        const btns = document.querySelectorAll('#options-container .btn');
        
        btns.forEach(b => b.disabled = true);

        if (idx === correctIdx) {
            btn.classList.add('correct');
            document.getElementById('feedback').innerText = "Pinter banget! Betul! ✨";
            score++;
        } else {
            if (btn) btn.classList.add('wrong');
            btns[correctIdx].classList.add('correct');
            document.getElementById('feedback').innerText = "Yah, salah! Jawaban benar: " + qData.a[correctIdx];
        }

        setTimeout(() => {
            currentIdx++;
            showQuestion();
        }, 2500);
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = "Skor Kamu: " + score + " / " + questions.length;
    }
</script>

</body>
</html>
