<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Morfologi Boneka Aku - Kak Azri</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ffcce5;
            --blue: #cce5ff;
            --yellow: #fff4bd;
            --green: #d2f8d2;
            --purple: #ecd4ff;
            --text: #5d4343;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(-45deg, var(--pink), var(--blue), var(--yellow), var(--purple));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Biar elemen melayang gak bikin scroll */
            color: var(--text);
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animasi Elemen Melayang di Background */
        .floating-item {
            position: absolute;
            z-index: -1;
            opacity: 0.6;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.05));
            animation: float-random 10s linear infinite;
        }

        @keyframes float-random {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        #main-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: 85%;
            max-width: 450px;
            text-align: center;
            border: 6px solid white;
            position: relative;
            z-index: 10;
            max-height: 85vh;
            overflow-y: auto;
        }

        h1 { color: #ff6b9d; font-weight: 700; font-size: 1.8rem; margin-bottom: 10px; }
        p { font-weight: 600; line-height: 1.5; font-size: 1.05rem; }

        .koala-container {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ff6b9d;
            border: 6px solid var(--pink);
            box-shadow: 0 8px 15px rgba(255, 107, 157, 0.2);
        }

        .btn-option {
            background: white;
            border: 3px solid var(--blue);
            padding: 14px 20px;
            margin: 10px 0;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            color: var(--text);
            transition: 0.2s;
            box-shadow: 0 4px 0 var(--blue);
        }

        .btn-option:hover { transform: translateY(-3px); box-shadow: 0 7px 0 var(--blue); }
        .btn-option:active { transform: translateY(2px); box-shadow: none; }

        .correct { background: #b8f2e6 !important; border-color: #8cecd9 !important; box-shadow: 0 4px 0 #8cecd9 !important; }
        .wrong { background: #ffdada !important; border-color: #ffbaba !important; box-shadow: 0 4px 0 #ffbaba !important; }

        .btn-primary {
            background: #ff6b9d;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #e05586;
            margin-top: 15px;
        }

        .review-box {
            text-align: left;
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .review-item { margin-bottom: 10px; border-bottom: 2px dashed var(--pink); padding-bottom: 5px; }
        .review-item b { color: #ff6b9d; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="floating-item" style="left: 10%; animation-duration: 8s;">🐨</div>
<div class="floating-item" style="left: 30%; animation-duration: 12s;">🌈</div>
<div class="floating-item" style="left: 50%; animation-duration: 7s;">✨</div>
<div class="floating-item" style="left: 70%; animation-duration: 10s;">🎀</div>
<div class="floating-item" style="left: 85%; animation-duration: 9s;">🌸</div>

<div id="main-card">
    <div id="welcome-screen">
        <div class="koala-container">🐨</div>
        <h1>Halo Kak Azri! 💖</h1>
        <p>Selamat Datang Peserta Ujian:<br><span style="color:#ff6b9d">Muhammad Fairuz Azri Irwanto</span></p>
        <p>Udah siap ujian morfologi boneka aku? <br>Ingat, cuma ada waktu 20 detik!</p>
        <button class="btn-primary" onclick="startQuiz()">Mulai Ujian ✨</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div id="timer" class="timer-circle">20</div>
        <h2 id="question-text" style="font-weight: 700;">Pertanyaan</h2>
        <div id="options-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <div class="koala-container">🎉</div>
        <h1>Selesai!</h1>
        <p id="final-score" style="font-size: 1.5rem; color: #ff6b9d;"></p>
        <p id="closing-msg"></p>
        <button class="btn-primary" onclick="showReview()">Lihat Jawaban Benar 📖</button>
        <button class="btn-primary" style="background:#8cecd9; box-shadow: 0 6px 0 #6ecab7;" onclick="location.reload()">Ulangi Ujian 🔄</button>
        
        <div id="review-section" class="hidden">
            <h3 style="margin-top:25px">Rangkuman Jawaban:</h3>
            <div id="review-list" class="review-box"></div>
        </div>
    </div>
</div>

<script>
    const questions = [
        { q: "Bagaimana saat Ntu menangis?", a: ["Kedua tangannya menutup mata", "Menutup telinga", "Sembunyi di bantal", "Berteriak kencang"], correct: 0 },
        { q: "Bagaimana tekstur bulu Ntu?", a: ["Sangat halus", "Tidak halus, tetapi tidak kasar juga", "Seperti handuk kasar", "Licin sekali"], correct: 1 },
        { q: "Ntu punya pita warna apa?", a: ["Merah dan hijau", "Pink dan putih", "Biru dan kuning", "Hitam dan ungu"], correct: 2 },
        { q: "Nama boneka rubah?", a: ["foxy", "mochi", "mpui", "lulu"], correct: 2 },
        { q: "Bagaimana tekstur bulu Mpui?", a: ["Kasar", "Tipis", "Agak lengket", "Halus dan lembut"], correct: 3 },
        { q: "Ici kalo marah namanya jadi siapa?", a: ["icung", "ica", "ici-ici", "cungir"], correct: 0 },
        { q: "Boneka capibara namanya siapa?", a: ["capy", "bara", "gembul", "heli"], correct: 3 },
        { q: "Mpui diberi nama pada tahun berapa?", a: ["2022", "2023", "2024", "2025"], correct: 2 },
        { q: "Mpui diberi nama dimana?", a: ["di taman", "di mall", "di lampu merah", "di toko buku"], correct: 2 },
        { q: "Tahun berapa Heli ditemukan?", a: ["2023", "2024", "2025", "2026"], correct: 3 },
        { q: "Hewan apa Ntu itu?", a: ["Panda", "Koala", "Beruang", "Kelinci"], correct: 1 }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let timeLeft = 20;
    let timerInterval;
    let canAnswer = true;

    function startQuiz() {
        document.getElementById('welcome-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        canAnswer = true;
        clearInterval(timerInterval);
        timeLeft = 20;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('timer').style.borderColor = "#ffcce5";

        const q = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = q.q;
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        q.a.forEach((opt, index) => {
            const button = document.createElement('button');
            button.innerText = opt;
            button.classList.add('btn-option');
            button.onclick = () => checkAnswer(index, button);
            optionsContainer.appendChild(button);
        });

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                autoWrong();
            }
        }, 1000);
    }

    function checkAnswer(selectedIndex, button) {
        if(!canAnswer) return;
        canAnswer = false;
        clearInterval(timerInterval);

        const correctIndex = questions[currentQuestionIndex].correct;
        if (selectedIndex === correctIndex) {
            button.classList.add('correct');
            score++;
        } else {
            button.classList.add('wrong');
            document.querySelectorAll('.btn-option')[correctIndex].classList.add('correct');
        }
        setTimeout(nextQuestion, 1500);
    }

    function autoWrong() {
        canAnswer = false;
        document.querySelectorAll('.btn-option')[questions[currentQuestionIndex].correct].classList.add('correct');
        setTimeout(nextQuestion, 1500);
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `Skor: ${score} / ${questions.length}`;
        
        let msg = score === questions.length ? "Wih! Kamu emang pacar terbaik! 😍" : "Semangat belajar lagi besok ya! 💖";
        document.getElementById('closing-msg').innerHTML = `${msg}<br><br>Makasih udah sayang sama boneka-boneka aku!`;
        
        // Siapkan list review
        let reviewHTML = "";
        questions.forEach((item, idx) => {
            reviewHTML += `<div class="review-item">${idx+1}. ${item.q}<br><b>Jawab: ${item.a[item.correct]}</b></div>`;
        });
        document.getElementById('review-list').innerHTML = reviewHTML;
    }

    function showReview() {
        document.getElementById('review-section').classList.toggle('hidden');
    }
</script>
</body>
</html>
